
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YU-GI-OH! DUEL CALCULATOR</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  min-height: 100vh;
  background: #101522;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  color: #e7c66b;
  letter-spacing: 3px;
  font-size: 25px;
  margin: 10px;
}

.players {
  display: flex;
  gap: 15px;
  max-width: 900px;
  margin: 20px auto;
}

.player {
  flex: 1;
  min-width: 0;
  background: linear-gradient(145deg,#28344c,#151d30);
  border: 2px solid #b99b53;
  border-radius: 15px;
  padding: 15px 10px;
}

.player h2 {
  color: #e7c66b;
  margin: 5px;
}

.name-input {
  width: 90%;
  max-width: 250px;
  padding: 9px;
  font-size: 19px;
  font-weight: bold;
  text-align: center;
  color: white;
  background: #182238;
  border: 1px solid #b99b53;
  border-radius: 8px;
}

.lp {
  font-size: clamp(35px, 8vw, 65px);
  font-weight: bold;
  margin: 18px 0;
  color: white;
  font-variant-numeric: tabular-nums;
}

input[type="number"] {
  width: 90%;
  max-width: 180px;
  padding: 10px;
  font-size: 20px;
  text-align: center;
  border-radius: 8px;
  border: none;
  margin: 8px 0;
}

button, select {
  border: none;
  border-radius: 8px;
  padding: 12px;
  margin: 4px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

.plus {
  background: #258b61;
  color: white;
}

.minus {
  background: #b63c48;
  color: white;
}

.quick {
  background: #394b68;
  color: white;
}

.reset {
  background: #d2a943;
  color: #111;
}

.timer-box, .coin-box {
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  background: #202b40;
  border: 1px solid #64728a;
  border-radius: 15px;
}

.timer-box h2, .coin-box h2 {
  color: #e7c66b;
}

#timer {
  font-size: 48px;
  font-weight: bold;
  color: #e7c66b;
  margin: 12px;
  font-variant-numeric: tabular-nums;
}

.timer-controls button {
  background: #405a80;
  color: white;
}

#coin {
  font-size: 60px;
  font-weight: bold;
  color: #e7c66b;
  margin: 10px;
}

#coinText {
  margin: 10px;
}

@media (orientation: landscape) {
  body {
    padding: 5px 12px;
    height: 100dvh;
    overflow: auto;
  }

  h1 {
    font-size: 19px;
    margin: 3px;
  }

  .players {
    max-width: 100%;
    margin: 8px auto;
    gap: 12px;
  }

  .player {
    padding: 8px;
  }

  .player h2 {
    margin: 3px;
  }

  .lp {
    font-size: clamp(40px, 8vw, 65px);
    margin: 8px;
  }

  .name-input {
    font-size: 16px;
    padding: 7px;
  }

  input[type="number"] {
    padding: 7px;
    margin: 4px;
  }

  button {
    padding: 9px 12px;
    margin: 3px;
  }

  .timer-box {
    display: inline-block;
    vertical-align: top;
    width: 55%;
    max-width: 450px;
    margin: 5px;
    padding: 8px;
  }

  .timer-box h2 {
    margin: 5px;
  }

  #timer {
    font-size: 35px;
    margin: 5px;
  }

  .coin-box {
    display: inline-block;
    vertical-align: top;
    width: 35%;
    max-width: 300px;
    margin: 5px;
    padding: 8px;
  }

  #coin {
    font-size: 35px;
    margin: 3px;
  }
}
</style>
</head>

<body>

<h1>YU-GI-OH! DUEL</h1>

<!-- PLAYER 1 / PLAYER 2 -->

<div class="players">

  <div class="player">
    <h2>
      <input
        type="text"
        class="name-input"
        id="name1"
        value="PLAYER 1"
        maxlength="20"
        placeholder="プレイヤー名">
    </h2>

    <div class="lp" id="lp1">8000</div>

    <input type="number" id="amount1" value="1000" min="0">

    <div>
      <button class="minus" onclick="changeLP(1,-1)">－ 減算</button>
      <button class="plus" onclick="changeLP(1,1)">＋ 加算</button>
    </div>

    <div>
      <button class="quick" onclick="quickLP(1,500)">+500</button>
      <button class="quick" onclick="quickLP(1,1000)">+1000</button>
      <button class="quick" onclick="quickLP(1,-500)">-500</button>
    </div>
  </div>

  <div class="player">
    <h2>
      <input
        type="text"
        class="name-input"
        id="name2"
        value="PLAYER 2"
        maxlength="20"
        placeholder="プレイヤー名">
    </h2>

    <div class="lp" id="lp2">8000</div>

    <input type="number" id="amount2" value="1000" min="0">

    <div>
      <button class="minus" onclick="changeLP(2,-1)">－ 減算</button>
      <button class="plus" onclick="changeLP(2,1)">＋ 加算</button>
    </div>

    <div>
      <button class="quick" onclick="quickLP(2,500)">+500</button>
      <button class="quick" onclick="quickLP(2,1000)">+1000</button>
      <button class="quick" onclick="quickLP(2,-500)">-500</button>
    </div>
  </div>

</div>

<button class="reset" onclick="resetLP()">LP RESET</button>

<!-- TIMER -->

<div class="timer-box">

  <h2>DUEL TIMER</h2>

  <select id="timerMode" onchange="changeMode()">
    <option value="up">カウントアップ</option>
    <option value="down">カウントダウン</option>
  </select>

  <div>
    <input type="number" id="minutes" value="40" min="0"
      style="width:80px"> 分

    <input type="number" id="seconds" value="0" min="0" max="59"
      style="width:80px"> 秒
  </div>

  <div id="timer">00:00</div>

  <div class="timer-controls">
    <button onclick="startTimer()">▶ START</button>
    <button onclick="pauseTimer()">Ⅱ PAUSE</button>
    <button onclick="resetTimer()">↺ RESET</button>
  </div>

</div>

<!-- COIN TOSS -->

<div class="coin-box">

  <h2>COIN TOSS</h2>

  <div id="coin">?</div>

  <div id="coinText">表か裏かを判定！</div>

  <button class="reset" onclick="flipCoin()">
    コイントス！
  </button>

</div>

<script>

// LP CALCULATOR

let lp = [8000, 8000];

function updateLP() {
  document.getElementById("lp1").textContent =
    lp[0].toLocaleString();

  document.getElementById("lp2").textContent =
    lp[1].toLocaleString();
}

function changeLP(player, direction) {
  const amount = Number(
    document.getElementById("amount" + player).value
  );

  if (!Number.isFinite(amount) || amount < 0) return;

  lp[player - 1] += amount * direction;
  updateLP();
}

function quickLP(player, amount) {
  lp[player - 1] += amount;
  updateLP();
}

function resetLP() {
  lp = [8000, 8000];
  updateLP();
}

// TIMER

let elapsed = 0;
let interval = null;

function getMode() {
  return document.getElementById("timerMode").value;
}

function getInitialTime() {
  const m = Math.max(
    0,
    Number(document.getElementById("minutes").value) || 0
  );

  const s = Math.max(
    0,
    Math.min(
      59,
      Number(document.getElementById("seconds").value) || 0
    )
  );

  return m * 60 + s;
}

function displayTimer() {
  let value = elapsed;

  if (getMode() === "down") {
    value = Math.max(0, getInitialTime() - elapsed);
  }

  const m = Math.floor(value / 60);
  const s = value % 60;

  document.getElementById("timer").textContent =
    String(m).padStart(2, "0") + ":" +
    String(s).padStart(2, "0");
}

function startTimer() {
  if (interval) return;

  if (getMode() === "down" && elapsed >= getInitialTime()) {
    elapsed = 0;
  }

  interval = setInterval(() => {
    elapsed++;
    displayTimer();

    if (
      getMode() === "down" &&
      elapsed >= getInitialTime()
    ) {
      pauseTimer();

      document.getElementById("timer").style.color =
        "#ff5555";
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(interval);
  interval = null;
}

function resetTimer() {
  pauseTimer();
  elapsed = 0;

  document.getElementById("timer").style.color =
    "#e7c66b";

  displayTimer();
}

function changeMode() {
  resetTimer();
}

// COIN TOSS

function flipCoin() {
  const result =
    Math.random() < 0.5 ? "表" : "裏";

  document.getElementById("coin").textContent =
    result === "表" ? "☀" : "🌙";

  document.getElementById("coinText").textContent =
    "結果：" + result;
}

// INITIALIZE

updateLP();
displayTimer();

</script>

</body>
</html>
