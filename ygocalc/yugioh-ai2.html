
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YU-GI-OH! DUEL CALCULATOR</title>

<style>
.jst-clock-box {

  margin: 12px auto;
  padding: 12px;
  background: #202b40;
  border: 1px solid #b99b53;

}

.jst-clock-box {
  max-width: 500px;
  margin: 12px auto;
  padding: 12px;
  background: #202b40;
  border: 1px solid #b99b53;
  border-radius: 12px;
}

.jst-label {
  color: #e7c66b;
  font-size: 12px;
  letter-spacing: 2px;
}

#jstClock {
  font-size: 32px;
  font-weight: bold;
  color: white;
  font-variant-numeric: tabular-nums;
  margin: 5px;
}

#jstDate {
  color: #aab7cc;
  font-size: 13px;
}

.history-time {
  display: block;
  color: #aab7cc;
  font-size: 12px;
  margin-top: 5px;
  line-height: 1.6;
}
.history-box {
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  background: #202b40;
  border: 1px solid #64728a;
  border-radius: 15px;
}

.history-box h2 {
  color: #e7c66b;
  margin-top: 5px;
}

#historyList {
  max-height: 220px;
  overflow-y: auto;
  text-align: left;
  padding: 0;
  margin: 10px 0;
  list-style: none;
}

#historyList li {
  padding: 9px 10px;
  margin: 5px 0;
  background: #182238;
  border-radius: 7px;
  border-left: 4px solid #64728a;
  font-size: 14px;
}

#historyList li:first-child {
  border-left-color: #e7c66b;
}

.history-empty {
  color: #9ba8bd;
  text-align: center;
  padding: 12px;
}
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  min-height: 100vh;
  background: #101522;
  color: white;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  color: #e7c66b;
  letter-spacing: 3px;
  font-size: 25px;
  margin: 10px;
}

.players {
  display: flex;
  gap: 15px;
  max-width: 900px;
  margin: 20px auto;
}

.player {
  flex: 1;
  min-width: 0;
  background: linear-gradient(145deg,#28344c,#151d30);
  border: 2px solid #b99b53;
  border-radius: 15px;
  padding: 15px 10px;
}

.player h2 {
  color: #e7c66b;
  margin: 5px;
}

.name-input {
  width: 90%;
  max-width: 250px;
  padding: 9px;
  font-size: 19px;
  font-weight: bold;
  text-align: center;
  color: white;
  background: #182238;
  border: 1px solid #b99b53;
  border-radius: 8px;
}

.lp {
  font-size: clamp(35px, 8vw, 65px);
  font-weight: bold;
  margin: 18px 0;
  color: white;
  font-variant-numeric: tabular-nums;
}

input[type="number"] {
  width: 90%;
  max-width: 180px;
  padding: 10px;
  font-size: 20px;
  text-align: center;
  border-radius: 8px;
  border: none;
  margin: 8px 0;
}

button, select {
  border: none;
  border-radius: 8px;
  padding: 12px;
  margin: 4px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.plus {
  background: #258b61;
  color: white;
}

.minus {
  background: #b63c48;
  color: white;
}

.quick {
  background: #394b68;
  color: white;
}

.reset {
  background: #d2a943;
  color: #111;
}

.undo {
  background: #64748b;
  color: white;
}

.timer-box, .coin-box {
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  background: #202b40;
  border: 1px solid #64728a;
  border-radius: 15px;
}

.timer-box h2, .coin-box h2 {
  color: #e7c66b;
}

#timer {
  font-size: 48px;
  font-weight: bold;
  color: #e7c66b;
  margin: 12px;
  font-variant-numeric: tabular-nums;
}

.timer-controls button {
  background: #405a80;
  color: white;
}

#coin {
  font-size: 60px;
  font-weight: bold;
  color: #e7c66b;
  margin: 10px;
  min-height: 75px;
}

#coinText {
  margin: 10px;
}

@media (orientation: landscape) {
  body {
    padding: 5px 12px;
    height: 100dvh;
    overflow: auto;
  }

  h1 {
    font-size: 19px;
    margin: 3px;
  }

  .players {
    max-width: 100%;
    margin: 8px auto;
    gap: 12px;
  }

  .player {
    padding: 8px;
  }

  .player h2 {
    margin: 3px;
  }

  .lp {
    font-size: clamp(40px, 8vw, 65px);
    margin: 8px;
  }

  .name-input {
    font-size: 16px;
    padding: 7px;
  }

  input[type="number"] {
    padding: 7px;
    margin: 4px;
  }

  button {
    padding: 9px 12px;
    margin: 3px;
  }

  .timer-box {
    display: inline-block;
    vertical-align: top;
    width: 55%;
    max-width: 450px;
    margin: 5px;
    padding: 8px;
  }

  .timer-box h2 {
    margin: 5px;
  }

  #timer {
    font-size: 35px;
    margin: 5px;
  }

  .coin-box {
    display: inline-block;
    vertical-align: top;
    width: 35%;
    max-width: 300px;
    margin: 5px;
    padding: 8px;
  }

  #coin {
    font-size: 35px;
    margin: 3px;
    min-height: 45px;
  }
}
</style>
</head>

<body>

<h1>YU-GI-OH! DUEL</h1>

<div class="jst-clock-box">
  <div class="jst-label">JAPAN STANDARD TIME</div>
  <div id="jstClock">00:00:00</div>
  <div id="jstDate"></div>
</div>

<!-- TIMER -->

<div class="timer-box">

  <h2>DUEL TIMER</h2>

  <select id="timerMode" onchange="changeMode()">
    <option value="up">カウントアップ</option>
    <option value="down">カウントダウン</option>
  </select>

  <div>
    <input type="number" id="minutes" value="40" min="0"
      style="width:80px"> 分

    <input type="number" id="seconds" value="0" min="0" max="59"
      style="width:80px"> 秒
  </div>

  <div id="timer">00:00</div>

  <div class="timer-controls">
    <button onclick="startTimer()">▶ START</button>
    <button onclick="pauseTimer()">Ⅱ PAUSE</button>
    <button onclick="resetTimer()">↺ RESET</button>
  </div>

</div>

<!-- PLAYERS -->

<div class="players">

  <div class="player">
    <h2>
      <input
        type="text"
        class="name-input"
        id="name1"
        value="PLAYER 1"
        maxlength="20"
        placeholder="プレイヤー名">
    </h2>

    <div class="lp" id="lp1">8000</div>

    <input type="number" id="amount1" value="1000" min="0">

    <div>
      <button class="minus" onclick="changeLP(1,-1)">－ 減算</button>
      <button class="plus" onclick="changeLP(1,1)">＋ 加算</button>
    </div>

    <div>
      <button class="quick" onclick="quickLP(1,500)">+500</button>
      <button class="quick" onclick="quickLP(1,1000)">+1000</button>
      <button class="quick" onclick="quickLP(1,-500)">-500</button>
    </div>
  </div>

  <div class="player">
    <h2>
      <input
        type="text"
        class="name-input"
        id="name2"
        value="PLAYER 2"
        maxlength="20"
        placeholder="プレイヤー名">
    </h2>

    <div class="lp" id="lp2">8000</div>

    <input type="number" id="amount2" value="1000" min="0">

    <div>
      <button class="minus" onclick="changeLP(2,-1)">－ 減算</button>
      <button class="plus" onclick="changeLP(2,1)">＋ 加算</button>
    </div>

    <div>
      <button class="quick" onclick="quickLP(2,500)">+500</button>
      <button class="quick" onclick="quickLP(2,1000)">+1000</button>
      <button class="quick" onclick="quickLP(2,-500)">-500</button>
    </div>
  </div>

  <!-- LP HISTORY -->

  <div class="history-box">

    <h2>LP HISTORY</h2>

    <ul id="historyList">
      <li class="history-empty">まだ履歴はありません</li>
    </ul>

  </div>


</div>

<div>
  <button class="reset" onclick="resetLP()">LP RESET</button>
  <button class="undo" id="undoButton" onclick="undoLP()" disabled>
    ↶ UNDO
  </button>
</div>

<!-- COIN TOSS -->

<div class="coin-box">

  <h2>COIN TOSS</h2>

  <div id="coin">?</div>

  <div id="coinText">表か裏かを判定！</div>

  <button class="reset" onclick="flipCoin()">
    コイントス！
  </button>

</div>

<script>

// LP CALCULATOR

let lp = [8000, 8000];

// UNDO HISTORY
let lpHistory = [];

// DISPLAY HISTORY
let actionHistory = [];

function updateLP() {
  document.getElementById("lp1").textContent =
    lp[0].toLocaleString();

  document.getElementById("lp2").textContent =
    lp[1].toLocaleString();

  updateUndoButton();
  updateHistory();
}

// UNDO BUTTON STATUS

function updateUndoButton() {
  document.getElementById("undoButton").disabled =
    lpHistory.length === 0;
}

// DISPLAY HISTORY

function updateHistory() {
  const list = document.getElementById("historyList");

  list.innerHTML = "";

  if (actionHistory.length === 0) {
    list.innerHTML =
      '<li class="history-empty">まだ履歴はありません</li>';
    return;
  }

  actionHistory.forEach(item => {
    const li = document.createElement("li");

    const title = document.createElement("strong");
    title.textContent = item.text;

    const time = document.createElement("span");
    time.className = "history-time";
    time.textContent =
      "JST " + item.jst +
      " ｜ DUEL " + item.timer;

    li.appendChild(title);
    li.appendChild(time);

    list.appendChild(li);
  });
}

// SAVE HISTORY

function saveLPHistory(message) {

  // UNDO用に現在の状態を保存
  lpHistory.push({
    lp: [...lp],
    history: [...actionHistory]
  });

  // JST時刻
  const now = new Date();

  const jstTime = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(now);

  const jstDate = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    month: "2-digit",
    day: "2-digit"
  }).format(now);

  // デュエルタイマーの時間
  let duelTime = elapsed;

  if (getMode() === "down") {
    duelTime = Math.max(0, getInitialTime() - elapsed);
  }

  const minutes = Math.floor(duelTime / 60);
  const seconds = duelTime % 60;

  const timerText =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");

  // 履歴を追加
  actionHistory.unshift({
    text: message,
    jst: jstDate + " " + jstTime,
    timer: timerText
  });

  updateUndoButton();
  updateHistory();
}

// CHANGE LP

function changeLP(player, direction) {
  const amount = Number(
    document.getElementById("amount" + player).value
  );

  if (!Number.isFinite(amount) || amount < 0) return;

  const change = amount * direction;

  saveLPHistory(
    "PLAYER " + player +
    "： " + (change > 0 ? "+" : "") +
    change.toLocaleString() +
    " LP"
  );

  lp[player - 1] += change;
  updateLP();
}

// QUICK LP

function quickLP(player, amount) {
  saveLPHistory(
    "PLAYER " + player +
    "： " + (amount > 0 ? "+" : "") +
    amount.toLocaleString() +
    " LP"
  );

  lp[player - 1] += amount;
  updateLP();
}

// RESET LP

function resetLP() {
  saveLPHistory("LP RESET：両プレイヤー8000 LPにリセット");

  lp = [8000, 8000];
  updateLP();
}

// UNDO

function undoLP() {
  if (lpHistory.length === 0) return;

  const previous = lpHistory.pop();

  lp = [...previous.lp];
  actionHistory = [...previous.history];

  updateLP();
}

// TIMER

let elapsed = 0;
let interval = null;

function getMode() {
  return document.getElementById("timerMode").value;
}

function getInitialTime() {
  const m = Math.max(
    0,
    Number(document.getElementById("minutes").value) || 0
  );

  const s = Math.max(
    0,
    Math.min(
      59,
      Number(document.getElementById("seconds").value) || 0
    )
  );

  return m * 60 + s;
}

function displayTimer() {
  let value = elapsed;

  if (getMode() === "down") {
    value = Math.max(0, getInitialTime() - elapsed);
  }

  const m = Math.floor(value / 60);
  const s = value % 60;

  document.getElementById("timer").textContent =
    String(m).padStart(2, "0") + ":" +
    String(s).padStart(2, "0");
}

function startTimer() {
  if (interval) return;

  if (getMode() === "down" && elapsed >= getInitialTime()) {
    elapsed = 0;
    document.getElementById("timer").style.color = "#e7c66b";
  }

  interval = setInterval(() => {
    elapsed++;
    displayTimer();

    if (
      getMode() === "down" &&
      elapsed >= getInitialTime()
    ) {
      pauseTimer();

      document.getElementById("timer").style.color =
        "#ff5555";
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(interval);
  interval = null;
}

function resetTimer() {
  pauseTimer();
  elapsed = 0;

  document.getElementById("timer").style.color =
    "#e7c66b";

  displayTimer();
}

function changeMode() {
  resetTimer();
}

// COIN TOSS

function flipCoin() {

  const coin = document.getElementById("coin");
  const coinText = document.getElementById("coinText");

  // まずアイコンと表示を初期化
  coin.textContent = "?";
  coinText.textContent = "コイントス中...";

  // 少し待ってから新しい結果を表示
  setTimeout(() => {

    const result =
      Math.random() < 0.5 ? "表" : "裏";

    coin.textContent =
      result === "表" ? "☀" : "🌙";

    coinText.textContent =
      "結果：" + result;

  }, 300);
}

// INITIALIZE

updateLP();
displayTimer();

// JST CLOCK

function updateJSTClock() {
  const now = new Date();

  document.getElementById("jstClock").textContent =
    new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);

  document.getElementById("jstDate").textContent =
    new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    }).format(now);
}

// JSTを1秒ごとに更新
updateJSTClock();
setInterval(updateJSTClock, 1000);	


</script>

</body>
</html>
